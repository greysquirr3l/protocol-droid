[workspace]
# Virtual manifest, so the resolver has to be stated explicitly: the `edition`
# in [workspace.package] does not switch the resolver for a virtual root.
# Resolver 3 turns on MSRV-aware dependency resolution, but ONLY when
# `rust-version` is actually set below and inherited by every member. Without
# that inheritance the floor is silently ignored and CI drifts onto crates that
# need a newer compiler than we claim to support.
resolver = "3"
members = [
    # Generated per-revision MCP wire types. Depends on nothing internal.
    "crates/protocol-droid-schema",
    # The library: canonical IR, codecs, session engine, transports.
    "crates/protocol-droid",
    # Procedural macros. Kept separate because a proc-macro crate cannot be
    # consumed by the crates it would otherwise be useful to.
    "crates/protocol-droid-macros",
    # The `protocol-droid` binary. Consumes the library, never the reverse.
    "crates/protocol-droid-cli",
    # Developer tooling, not published. See xtask/Cargo.toml for the
    # crate-count justification AGENTS.md requires.
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Published MSRV floor. The `channel` in rust-toolchain.toml is the toolchain we
# develop and test on; this is the oldest compiler a consumer may build against.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
# Matches the `origin` remote. `cargo deny` requires a non-placeholder
# repository field, so it cannot be omitted; crates.io shows it on the crate
# page and every `cargo add` inherits it.
repository = "https://github.com/greysquirr3l/protocol-droid"
homepage = "https://github.com/greysquirr3l/protocol-droid"
documentation = "https://docs.rs/protocol-droid"
readme = "README.md"
keywords = ["mcp", "jsonrpc", "model-context-protocol", "protocol"]
categories = [
    "network-programming",
    "parser-implementations",
    "web-programming::http",
]

[workspace.dependencies]
# Crate versions are collected here so a member only names the dependencies it
# actually uses. The `version` fields on the internal path dependencies must be
# bumped in lockstep with `version` above: Cargo does not interpolate
# `version.workspace = true` inside [workspace.dependencies].
protocol-droid-schema = { path = "crates/protocol-droid-schema", version = "0.1.0" }
protocol-droid = { path = "crates/protocol-droid", version = "0.1.0" }
protocol-droid-macros = { path = "crates/protocol-droid-macros", version = "0.1.0" }

# MSRVs verified with `cargo info` against the 1.98 floor, not inferred from the
# version the API stabilised in. See PROGRESS.md Accumulated Learnings.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# Benchmarking. The envelope path is the one perf-critical path in the crate, so
# its costs are measured on every CI run rather than estimated.
divan = { version = "0.1.21", default-features = false }
# The dynamic registry's snapshot. `ArcSwap<Snapshot>` is the transaction
# boundary: a writer builds a whole new snapshot and swaps the `Arc` in one
# atomic store, and a reader on the `tools/list` or `tools/call` path pays a
# load and nothing else. `1.9.2` is the latest release and declares no
# `rust-version` at all, so it cannot drag the 1.98 floor upward — verified with
# `cargo info arc-swap` rather than assumed, and the absence of a declared MSRV
# is recorded in PROGRESS.md because an undeclared floor is not the same as a low
# one. The crate is not a model-checker target: it has no `loom` instrumentation
# (checked in its own source), so loom could not see the swap it is there to
# verify. T11's concurrency proof is a std-thread stress test over the real type
# for that reason.
arc-swap = { version = "1.9.2" }
# Assertion macros that print the actual variant on failure. `assert!(matches!(..))`
# reports only "assertion failed", which is useless for an error-code test
# where the whole point is *which* code came back.
assert_matches = "1.5.0"

# Property-based testing for the generated wire types. `fork` and `timeout` are
# off: they exist to persist a failing case across runs via a temp directory,
# which this suite does not want — a regression is caught in CI on every run,
# and the extra `tempfile`/`rusty-fork` subtree is not worth carrying.
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }
# Validates generated values against the vendored schema.json. Default features
# are off because they pull `reqwest` and a TLS stack for remote `$ref`
# resolution; every reference in these schemas is local (`#/definitions/...`).
jsonschema = { version = "0.58.5", default-features = false }
# Snapshot testing for the feature matrix. Default features are off: they pull
# `pest`, `regex`, `ron`, `yaml` and `toml` for formats this suite does not
# snapshot, and the dependency is only here to hold the golden feature profiles
# for a human to review.
insta = { version = "1.43.0", default-features = false }
# Test-only, and deliberately a dev-dependency: the session engine's domain is
# runtime-free, so a production `tokio` dependency would be the crate reaching
# for an executor it does not own. The features are the minimum that runs a
# multi-task test with a paused clock — `test-util` for `time::pause`, which is
# what makes a deadline testable without a real sleep.
tokio = { version = "1.48.0", default-features = false, features = [
    "macros",
    "rt",
    "sync",
    "time",
    "test-util",
] }
thiserror = "2.0.21"
anyhow = "1.0.104"
# Provenance manifest parsing and content digests for the vendored spec files.
# Both are build-time-only concerns but `toml` is also re-exported from the
# domain module so downstream refresh tooling can read a manifest back.
toml = "0.9.8"
sha2 = "0.10.9"
# HTTP client for `cargo xtask refresh-spec`. MSRV 1.85 via `cargo info`, below
# this workspace's 1.98 floor. rustls by default: no OpenSSL, no system TLS.
ureq = "3.4.2"
# Colour and wrapping are disabled: a CLI piped into another process should not
# emit escape sequences, and the narrower build keeps the binary honest.
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }

# The lint profile. Mirrored in `.cargo/config.toml` under `[alias] l` so that
# `cargo l` works from a bare checkout, and here so that a bare `cargo clippy`
# enforces exactly the same set. The two must be kept in step.
#
# Cargo applies lint levels in priority order, so the groups carry
# `priority = -1`: without it a group default would outrank the per-lint
# decisions made below it and `deny` would silently lose to `warn`.
[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# 1.96 onward this is deny-by-default; named here so the floor is explicit.
uninhabited_static = "deny"
# A denial in a port trait is inherited by every impl of that trait (changed in
# 1.94), so a missing doc comment surfaces at the adapter, not at the trait.
ambiguous_glob_imported_traits = "deny"
# Only meaningful for binary crates, harmless elsewhere.
dead_code_pub_in_binary = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# Deliberately fatal. These are the project standards, not preferences.
#
# `suspicious` is itself a lint *group*, so it sits with the other groups at
# priority -1 rather than at the implicit 0. Cargo rejects a group that shares a
# priority with a plain lint, and the specific lints above it have to outrank
# the broad groups for their `deny` to take effect.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_ptr_alignment = "deny"
suspicious = { level = "deny", priority = -1 }

# Deliberately tolerated across the workspace.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
