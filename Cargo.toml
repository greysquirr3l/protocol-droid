[workspace]
# Virtual manifest, so the resolver has to be stated explicitly: the `edition`
# in [workspace.package] does not switch the resolver for a virtual root.
# Resolver 3 turns on MSRV-aware dependency resolution, but ONLY when
# `rust-version` is actually set below and inherited by every member. Without
# that inheritance the floor is silently ignored and CI drifts onto crates that
# need a newer compiler than we claim to support.
resolver = "3"
members = [
    # Generated per-revision MCP wire types. Depends on nothing internal.
    "crates/protocol-droid-schema",
    # The library: canonical IR, codecs, session engine, transports.
    "crates/protocol-droid",
    # Procedural macros. Kept separate because a proc-macro crate cannot be
    # consumed by the crates it would otherwise be useful to.
    "crates/protocol-droid-macros",
    # The `protocol-droid` binary. Consumes the library, never the reverse.
    "crates/protocol-droid-cli",
    # Developer tooling, not published. See xtask/Cargo.toml for the
    # crate-count justification AGENTS.md requires.
    "xtask",
]

# Crates that live inside the workspace's directory tree but should
# not be workspace members. Each one is a transient interop or
# fixture crate with its own resolver, so the workspace's pinned
# versions do not leak into it.
#
# `crates/protocol-droid/tests/interop_rmcp` is the T22 interop
# test crate for `rmcp`; pinning it at a fixed rmcp version
# (`=3.5.1`) would otherwise pin every workspace member too.
#
# `crates/protocol-droid/tests/interop_ts_sdk` is the T22 interop
# test crate for the official TypeScript MCP SDK
# (`@modelcontextprotocol/sdk`). It is the same shape as
# `interop_rmcp` but with a `node_modules/` sub-tree populated
# by `npm install`; the Cargo side is small and the
# `package-lock.json` is the contract that pins the SDK.
exclude = [
    "crates/protocol-droid/tests/interop_rmcp",
    "crates/protocol-droid/tests/interop_ts_sdk",
    "crates/protocol-droid/fuzz",
]

[workspace.package]
# 0.2.0, not 0.1.1: `ServerBuilder::resource` and `::prompt` are renamed to
# `resource_with` / `prompt_with` (a bare `#[resource]` is now a compile error),
# which breaks source for anyone who registered a listing-only resource. Under
# semver a breaking change from 0.1.x is 0.2.x. Every member inherits this, so
# the four crates always ship at the same version.
#
# 0.3.0 for the same reason: `LegacyDispatcher` gained an associated type and an
# `open` method, which breaks anyone who implemented it.
#
# 0.4.0 because `McpRouter::into_router` now mounts the RFC 9728 protected-
# resource document when `with_resource_metadata` is set. A deployment that
# configured the metadata to get a `WWW-Authenticate` challenge and served that
# same document on its own route now has both, so the behaviour change is on a
# path that was previously inert rather than on a live one.
#
# 0.4.3 is a patch: everything since 0.4.1 is documentation, release tooling
# and dev-dependencies. The docs-site deploy script gets four fixes — one of
# which let it report success while deploying nothing — the GitHub Actions
# move off Node 20, and the release chain learns to say "nothing to release"
# out loud instead of reading like a failure. No library behaviour changes.
#
# 0.4.2 was tagged but never published, so the 0.4.3 release carried everything
# since 0.4.1 in one entry. There is no 0.4.2 on crates.io and never will be;
# the version was skipped rather than backfilled.
#
# 0.5.0 is a minor because `TokenClaims::audience` returns `&[Audience]` rather
# than `&[ResourceUri]`, and `with_audience_string` now retains an `aud` entry
# it cannot parse instead of dropping it. Both follow from `aud` no longer
# being modelled as an RFC 9728 resource identifier — see #46, where an `aud`
# that is not an absolute URI had nowhere to go and was silently lost.
#
# 0.5.1 is a patch: no public API changes. The JWT source reads the granted
# permissions out of `scp` as well as `scope`, which is what a Microsoft Entra
# delegated token carries and what every such token was being refused for.
#
# 0.5.2 is a patch for the same reason, and the reason is worth recording
# because 57 files moved. #50 broke seven oversized files into smaller ones and
# #53 moved the documentation site's dependencies. Not one line of the public
# API changed: the new submodules were made private in cc579cfc, and the one
# type that genuinely moved (`DispatchError`, from `server::builder` to
# `server::error`) is still re-exported from where it was. That was checked by
# diffing the generated rustdoc for `main` against this branch and by
# compiling a probe that imports all 25 previously-public paths from both their
# old and new sites. None of it touches a consumer's code.
version = "0.5.2"
edition = "2024"
# Published MSRV floor. The `channel` in rust-toolchain.toml is the toolchain we
# develop and test on; this is the oldest compiler a consumer may build against.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
# Matches the `origin` remote. `cargo deny` requires a non-placeholder
# repository field, so it cannot be omitted; crates.io shows it on the crate
# page and every `cargo add` inherits it. `homepage` is intentionally not
# also set: as of nightly the manifest linter treats `homepage == repository`
# as redundant, and a workspace inheritance that triggers a lint is worse
# than the cosmetic loss of the field.
repository = "https://github.com/greysquirr3l/protocol-droid"
documentation = "https://docs.rs/protocol-droid"
readme = "README.md"
# crates.io caps a keyword at 20 characters, and `model-context-protocol` is
# 22. The registry rejects the whole publish on that, not just the keyword, so
# the long form is deliberately absent and `model-context` carries the search.
# `categories` is NOT inherited: they differ per crate, and a category slug the
# registry does not recognise fails the publish the same way an over-long
# keyword does.
keywords = ["mcp", "jsonrpc", "model-context", "protocol"]

[workspace.dependencies]
# Crate versions are collected here so a member only names the dependencies it
# actually uses. The `version` fields on the internal path dependencies must be
# bumped in lockstep with `version` above: Cargo does not interpolate
# `version.workspace = true` inside [workspace.dependencies]. That is why the
# macros entry exists rather than the library naming `../protocol-droid-macros`
# directly — one list to bump, and `cargo` cannot resolve a workspace
# dependency for a crate the workspace forgot to declare.
protocol-droid-schema = { path = "crates/protocol-droid-schema", version = "0.5.2" }
protocol-droid-macros = { path = "crates/protocol-droid-macros", version = "0.5.2" }
protocol-droid = { path = "crates/protocol-droid", version = "0.5.2" }

# MSRVs verified with `cargo info` against the 1.98 floor, not inferred from the
# version the API stabilised in. See PROGRESS.md Accumulated Learnings.
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# T16. JWT signature verification for the JWKS token source.
#
# `default-features = false` drops `use_pem`, which pulls `pem` and
# `simple_asn1` for reading keys out of PEM files. A JWKS is JSON: an MCP
# server's public keys arrive over HTTP as a key set, so the PEM path has no
# caller here and its two dependencies have no reason to be in the graph.
#
# `rust_crypto` rather than `aws_lc_rs` because CI builds three OSes and
# aws-lc-rs needs cmake plus NASM on some of them. The pure-Rust backend is
# portable by construction, and every algorithm MCP deployments actually use
# (RS256/384/512, ES256, HS256) is implemented by it.
jsonwebtoken = { version = "11.1.0", default-features = false, features = [
    "rust_crypto",
] }
# The OS CSPRNG for `RandomIds`. Already in the graph through `rsa`, declared
# directly because relying on a transitive dependency is how an upgrade turns
# into a build break.
getrandom = { version = "0.4.3", features = ["std"] }
# Benchmarking. The envelope path is the one perf-critical path in the crate, so
# its costs are measured on every CI run rather than estimated.
divan = { version = "0.1.21", default-features = false }
# The dynamic registry's snapshot. `ArcSwap<Snapshot>` is the transaction
# boundary: a writer builds a whole new snapshot and swaps the `Arc` in one
# atomic store, and a reader on the `tools/list` or `tools/call` path pays a
# load and nothing else. `1.9.2` is the latest release and declares no
# `rust-version` at all, so it cannot drag the 1.98 floor upward — verified with
# `cargo info arc-swap` rather than assumed, and the absence of a declared MSRV
# is recorded in PROGRESS.md because an undeclared floor is not the same as a low
# one. The crate is not a model-checker target: it has no `loom` instrumentation
# (checked in its own source), so loom could not see the swap it is there to
# verify. T11's concurrency proof is a std-thread stress test over the real type
# for that reason.
arc-swap = { version = "1.9.2" }
# Assertion macros that print the actual variant on failure. `assert!(matches!(..))`
# reports only "assertion failed", which is useless for an error-code test
# where the whole point is *which* code came back.
assert_matches = "1.5.0"

# Property-based testing for the generated wire types. `fork` and `timeout` are
# off: they exist to persist a failing case across runs via a temp directory,
# which this suite does not want — a regression is caught in CI on every run,
# and the extra `tempfile`/`rusty-fork` subtree is not worth carrying.
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }
# Validates generated values against the vendored schema.json. Default features
# are off because they pull `reqwest` and a TLS stack for remote `$ref`
# resolution; every reference in these schemas is local (`#/definitions/...`).
jsonschema = { version = "0.58.5", default-features = false }
# Snapshot testing for the feature matrix. Default features are off: they pull
# `pest`, `regex`, `ron`, `yaml` and `toml` for formats this suite does not
# snapshot, and the dependency is only here to hold the golden feature profiles
# for a human to review.
insta = { version = "1.43.0", default-features = false }
# Test-only, and deliberately a dev-dependency: the session engine's domain is
# runtime-free, so a production `tokio` dependency would be the crate reaching
# for an executor it does not own. The features are the minimum that runs a
# multi-task test with a paused clock — `test-util` for `time::pause`, which is
# what makes a deadline testable without a real sleep.
tokio = { version = "1.48.0", default-features = false, features = [
    "macros",
    "net",
    "rt",
    "sync",
    "time",
    "test-util",
] }
# T14. The Streamable HTTP server. MSRV 1.80 per `cargo info axum`, well under
# this workspace's 1.98 floor, so the gate does not move the published MSRV.
# `default-features = false` because the adapter uses none of the extras: the
# routes take a raw body (the framing layer already decided what a frame is),
# not a `Form`, and there is no query string, no matched-path, and no
# `tower-log`. `json` stays on because axum's own `Json` extractor is how a
# JSON body is read; the alternative is hand-rolling the same
# `serde_json::from_slice` against a content-type check.
# `query` is here for the 2024-11-05 transport, which names the session in the
# query string of the URI the server itself advertised. There is no header for
# it on that revision, so there is nothing to extract but the query.
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
# The `Stream` trait the SSE responder consumes. `no_std` and dependency-free,
# so the whole cost of a streaming response is this one trait — everything
# else about the stream is ours (`sse::ReplayStream`).
futures-core = "0.3.31"
futures-util = "0.3.31"
# `ServiceExt::oneshot` drives a `Router` in a test without binding a socket.
# A dev-dependency rather than a real one: nothing in the adapter needs to
# call a `Service`, only a test does.
tower = { version = "0.5.2", default-features = false }
# T14. The Streamable HTTP **client**, the mirror image of the axum server
# above and gated by the same feature. `default-features = false` because the
# defaults are a second TLS stack, a blocking pool, cookies, gzip and a system
# proxy resolver that a JSON-RPC peer has no use for. `rustls-tls` and not
# `native-tls`: the task says rustls only, and on a crate whose whole point is
# that the same bytes behave the same on every target, a dependency on the
# platform's OpenSSL is exactly the portability trap the MSRV rule warns about.
# `stream` is the one non-obvious choice — it is what turns a response body
# into a `Stream` of chunks, which is the difference between a resumable read
# and a `bytes()` that buffers an SSE response that never ends.
reqwest = { version = "0.12.24", default-features = false, features = [
    "rustls-tls",
    "stream",
] }
thiserror = "2.0.21"
anyhow = "1.0.104"
# Provenance manifest parsing and content digests for the vendored spec files.
# Both are build-time-only concerns but `toml` is also re-exported from the
# domain module so downstream refresh tooling can read a manifest back.
# `parse` + `serde` are required by `toml::from_str` in 1.0+; without them the
# re-export would compile but the call site in the manifest verifier would
# resolve to a missing-function rather than a parse error.
toml = { version = "1.1.6", features = ["parse", "serde"] }
sha2 = "0.11.1"
# SEP-2322 `requestState` integrity. 0.13 is the line that pairs with
# `sha2` 0.11 (digest 0.11); 0.12 would pull a second digest stack.
hmac = "0.13.0"
# HTTP client for `cargo xtask refresh-spec`. MSRV 1.85 via `cargo info`, below
# this workspace's 1.98 floor. rustls by default: no OpenSSL, no system TLS.
ureq = "3.4.2"
# Colour and wrapping are disabled: a CLI piped into another process should not
# emit escape sequences, and the narrower build keeps the binary honest.
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }

# The lint profile. Mirrored in `.cargo/config.toml` under `[alias] l` so that
# `cargo l` works from a bare checkout, and here so that a bare `cargo clippy`
# enforces exactly the same set. The two must be kept in step.
#
# Cargo applies lint levels in priority order, so the groups carry
# `priority = -1`: without it a group default would outrank the per-lint
# decisions made below it and `deny` would silently lose to `warn`.
[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# 1.96 onward this is deny-by-default; named here so the floor is explicit.
uninhabited_static = "deny"
# A denial in a port trait is inherited by every impl of that trait (changed in
# 1.94), so a missing doc comment surfaces at the adapter, not at the trait.
ambiguous_glob_imported_traits = "deny"
# Only meaningful for binary crates, harmless elsewhere.
dead_code_pub_in_binary = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# Deliberately fatal. These are the project standards, not preferences.
#
# `suspicious` is itself a lint *group*, so it sits with the other groups at
# priority -1 rather than at the implicit 0. Cargo rejects a group that shares a
# priority with a plain lint, and the specific lints above it have to outrank
# the broad groups for their `deny` to take effect.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_ptr_alignment = "deny"
suspicious = { level = "deny", priority = -1 }

# Deliberately tolerated across the workspace.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
