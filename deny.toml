# Supply-chain policy for protocol-droid. Enforced in CI and in the preflight
# command via `cargo deny --all-features check`.
#
# Two rules govern this file.
#
# 1. `cargo deny` reads a CACHED advisory database locally, so a green run on
#    your machine can be missing an advisory that CI — which always fetches
#    fresh — will fail on. Never remove or narrow an entry here because a local
#    run was green. Re-run with network access and confirm the advisory is
#    genuinely gone from the dependency graph.
#
# 2. An `ignore` entry is a waiver, not a fix. Every waiver must name the
#    RUSTSEC identifier, say why the advisory is not reachable from this code,
#    and state the condition that would retire it. A silent waiver is worse
#    than no waiver, because it looks like a pass.
#
# The list is currently empty and that is a fact about the graph, not an
# omission: the workspace's third-party dependencies are serde, thiserror,
# anyhow and clap, none of which carry an advisory.

[graph]
# Resolve with every feature on, so the graph covers the widest surface CI
# builds. The `--no-default-features` extreme is a subset of this.
all-features = true

[advisories]
version = 2
# A yanked release in the lockfile is a supply-chain risk in its own right.
yanked = "deny"
# Crates with no repository and no releases are how the `left-pad` incidents
# happen. The workspace itself is exempt via `unmaintained = "workspace"`.
unmaintained = "workspace"
# One entry, and the reasoning is the point — do not add a second without the
# same kind of argument.
#
# RUSTSEC-2023-0071 (CVE-2023-49092, the "Marvin Attack") on `rsa 0.9.10`,
# reached through `jsonwebtoken`'s `rust_crypto` backend. Upstream marks
# `patched = []` *intentionally* (RustCrypto/RSA#626): the crypto-bigint
# migration did not close it, and the remaining work is implicit rejection and
# default-path blinding. There is no version to upgrade to, so this ignore does
# not expire on a schedule and must be re-read whenever `jsonwebtoken` or `rsa`
# changes.
#
# Why the vulnerable path is unreachable here: Marvin's threat model is RSA
# operations performed *with a private key* — the paper's own wording is
# "RSA decryption and signing operations... performed with the private key". It
# recovers that key from how long the operation takes. This crate never does
# either: the JWKS source calls `DecodingKey::from_jwk` and verifies a signature,
# which is a public-key operation, and `JwtSource` has no path that accepts a
# private key at all — the key set is fetched over HTTP from the authorization
# server's published `jwks_uri` and is never writable by a peer.
#
# Stated precisely, because the weaker version of this argument is wrong. The
# remaining side channels live in `rsa`'s de-padding, which is shared with the
# verification path, so this is not "the buggy code is not linked in". It is
# that the oracle Marvin needs has to leak *private key material*, and
# verification has none to leak. An oracle about a candidate signature is not
# the same attack as an oracle about the key.
#
# What this buys is a tracked, reasoned exception rather than a silent one. If a
# token source is ever added that accepts a caller-supplied PEM private key
# (client credentials, an mTLS-bound AS), this entry stops being true and must be
# revisited. The upstream tracking issue is RustCrypto/RSA#626; the fix is an
# API redesign (implicit rejection, #680, and default-path blinding, #702), so
# this should be re-checked on every `jsonwebtoken` or `rsa` bump rather than
# waited on a schedule.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 Marvin Attack timing leak; no upstream fix exists and this crate only ever verifies RSA signatures with public keys, never decrypts or uses a private key, so the vulnerable path is unreachable" },
]

[licenses]
version = 2
# The project's own licence is MIT OR Apache-2.0.
#
# This list is deliberately EXACT rather than "everything permissive". cargo-deny
# reports an allow-list entry it never encountered as a `license-not-encountered`
# warning, and this workspace denies warnings, so padding the list with licences
# that no dependency currently uses would fail CI. The upside of the tight list
# is the point: adding a dependency under a new licence is a deliberate, visible
# change to this file, reviewed in the same commit as the dependency, rather than
# something a pre-loaded allow-list waves through.
#
# Currently matched by the graph as `(MIT OR Apache-2.0) AND Unicode-3.0`,
# `MIT`, `MIT OR Apache-2.0`, and `Unlicense OR MIT`, plus the TLS stack below.
#
# `ISC` and `BSD-3-Clause` come from the HTTPS client `cargo xtask refresh-spec`
# needs, via rustls: `ring` is `Apache-2.0 AND ISC`, `rustls-webpki` is `ISC`,
# and `subtle` is `BSD-3-Clause`. All three are permissive, OSI-approved, and
# the licences the rustls ecosystem has standardised on. They are not on this
# list for `ring`'s own sake: refusing them would mean not fetching spec
# revisions over TLS at all, which is a worse trade than accepting two more
# well-known permissive licences in a build-time-only dependency.
# `CDLA-Permissive-2.0` is the one entry on this list that is not a software
# licence, and it is here deliberately: it covers `webpki-roots`, a data package
# that is a compiled bundle of public CA root certificates, reached only through
# the build-time-only `xtask` binary. That binary is `publish = false` and is
# never linked into the published `protocol-droid` library or CLI, and the
# licence is a permissive data licence with no copyleft obligation we could
# trigger. It exists to keep a published binary free of a weak-copyleft
# dependency; if this tool ever shipped inside one, revisit this line.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
# A licence we cannot confidently identify is not automatically acceptable.
confidence-threshold = 0.93
# Per-licence exceptions, for a crate that needs a licence outside the list
# above. Each entry names the crate and carries a reason. None today.
exceptions = []

[bans]
# Two versions of one crate in the graph is a real cost: it doubles the
# compiled surface and it is how duplicate-CVE stories start. Deny it, and add
# a documented `skip` if a real conflict appears.
multiple-versions = "deny"
# A wildcard dependency is a version that changes without a commit.
wildcards = "deny"
deny = []
# `toml` 0.9 depends on `winnow` 0.7 for one code path and on `toml_parser`,
# which depends on `winnow` 1.0, for the other. Both majors are in the same
# upstream crate and `toml` controls the pairing, so the conflict is not
# resolvable from here. One duplicate of a parser library is a fair price for
# a manifest format we parse at build time and in a developer tool.
skip = [
    { crate = "windows-sys", versions = ["0.52", "0.61"], reason = "two unrelated upstreams: 0.52 via errno (rustix, under the dev-only insta -> tempfile chain) and 0.61 via mio (tokio). Neither edge is ours to choose, and a version bump in either is the only way this resolves" },
    { crate = "base64", versions = ["0.22", "0.23"], reason = "two unrelated upstreams: 0.22 via reqwest's own encoding path and 0.23 via hyper-util (axum, and the tls stack reqwest shares with it) plus ureq (xtask). reqwest 0.12 pins its own major, and neither edge is ours to choose" },
    { crate = "syn", versions = ["2.0", "3.0"], reason = "two unrelated upstreams: 3.0 via clap_derive (every CLI surface) and 2.0 via zeroize_derive, reached through the ES256 path (jsonwebtoken -> p256 -> ecdsa -> elliptic-curve -> crypto-bigint -> zeroize). clap 4.6 pins syn 3 and the RustCrypto stack pins syn 2; neither edge is ours to choose, and the conflict only surfaces because a *non-dev* crypto path now pulls syn 2" },
    { crate = "digest", versions = ["0.10", "0.11"], reason = "sha2 0.11 (workspace, 1.98 MSRV-clean) pairs with digest 0.11, while the rest of the RustCrypto stack transitively reached from jsonwebtoken (ecdsa 0.16, p256/p384 0.13) still pins digest 0.10. The digest crate's MSRV policy lets both majors coexist in one graph; bumping the rest of the stack to digest 0.11 is its own audit and outside the scope of a single sha2 bump" },
    { crate = "block-buffer", versions = ["0.10", "0.12"], reason = "follows the digest pair: block-buffer 0.10 ships under digest 0.10 (RustCrypto 0.16 / 0.13 stack) and block-buffer 0.12 ships under digest 0.11 (sha2 0.11). One compile-time duplicate of an 8-KB block-iteration crate; resolves only when the rest of the RustCrypto stack catches up" },
    { crate = "crypto-common", versions = ["0.1", "0.2"], reason = "follows the digest pair: crypto-common 0.1 under digest 0.10 and crypto-common 0.2 under digest 0.11. The crate is a trait-only abstraction; the duplicate is symbol-level not behaviour-level" },
    { crate = "const-oid", versions = ["0.9", "0.10"], reason = "follows the der / spki pair: const-oid 0.9 under der 0.7 (RustCrypto 0.16 / 0.13 stack via jsonwebtoken) and const-oid 0.10 under der 0.8 / spki 0.8 (sha2 0.11's transitive). The crate is a const OID parser; the duplicate is symbol-level" },
    { crate = "cpufeatures", versions = ["0.2", "0.3"], reason = "follows the sha2 pair: cpufeatures 0.2 under sha2 0.10 (RustCrypto 0.16 / 0.13 stack via jsonwebtoken) and cpufeatures 0.3 under sha2 0.11. The crate is a build-script-only CPU feature probe; the duplicate is build-time not runtime" },
    { crate = "sha2", versions = ["0.10", "0.11"], reason = "in transition: workspace pins sha2 0.11 (protocol-droid-schema manifest digests, protocol-droid PKCE) while the RustCrypto 0.16 / 0.13 stack reached through jsonwebtoken (p256, p384, ed25519-dalek) still pins sha2 0.10. The duplicate is the cost of one sha2 bump; resolves when the rest of the RustCrypto stack catches up to digest 0.11 / sha2 0.11, which is its own audit" },
    { crate = "hmac", versions = ["0.12", "0.13"], reason = "follows the digest pair: protocol-droid seals SEP-2322 requestState with hmac 0.13 over sha2 0.11 (digest 0.11), while hkdf 0.12 under elliptic-curve 0.13 (jsonwebtoken -> p256/p384) still pins hmac 0.12 on digest 0.10. Choosing 0.12 here would instead duplicate sha2's whole digest-0.10 line for a second consumer; resolves with the rest of the RustCrypto stack" },
    { crate = "getrandom", versions = ["0.2", "0.3", "0.4"], reason = "in transition: workspace pins getrandom 0.4 (protocol-droid IdSource, OsSecrets) while the RustCrypto 0.16 / 0.13 stack reached through jsonwebtoken (rand_core 0.6 -> getrandom 0.2) still pins 0.2, and transitive dev-only deps (fastrand 2 -> getrandom 0.3) sit in the middle. Resolves when the rest of the stack catches up to rand 0.9 / getrandom 0.4, which is its own audit" },
    { crate = "rand_core", versions = ["0.6", "0.10"], reason = "follows the getrandom transition: proptest 1.12 moved to rand 0.10 (rand_core 0.10) for property tests, while the RustCrypto 0.16 / 0.13 stack reached through jsonwebtoken (p256, p384) still pins rand_core 0.6. rand_core is a trait-and-integer surface with no shared ABI, so the duplicate is symbol-level; resolves when the RustCrypto stack reaches rand 0.10, which is its own audit. Dev-only edge — the 0.10 line is reached from proptest, not from anything the crates publish" },
]
skip-tree = []

[sources]
# Fail closed on anything that is not crates.io. A dependency pulled from a
# git URL or an unknown registry bypasses the advisory database entirely.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# A git source is allowed only with a stated reason. None today; add the URL
# and the justification together, never the URL alone.
allow-git = []
