[book]
title = "protocol-droid"
authors = ["greysquirr3l"]
language = "en"
description = "A Rust MCP toolkit that speaks every published spec revision at once."
src = "docs/guide/src"

[build]
# The default would put the rendered book under `book/`, which is the
# `book/` directory a published mdbook carries. Putting it under
# `target/book/` keeps the workspace clean and means a `cargo clean`
# removes the render output.
build-dir = "target/book"
create-missing = true

[output.html]
# A GitHub Pages render of the book is published by the docs workflow,
# not built locally. The default theme is fine for a first pass; the
# house style is its own task.
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/greysquirr3l/protocol-droid"
edit-url-template = "https://github.com/greysquirr3l/protocol-droid/edit/main/docs/guide/{path}"

[output.html.fold]
enable = true
level = 1
