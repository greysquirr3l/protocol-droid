name: Release

# DISABLED — manual trigger only. There is deliberately no automatic trigger.
#
# The `publish` job uploads four crates to crates.io, and the review gate that
# is supposed to sit in front of it is not real: the `release` environment
# exists but carries no protection rules, because GitHub does not offer required
# reviewers for private repositories on the free plan. The former
# `workflow_run` trigger meant a green CI run on main would publish unattended.
#
# Re-enabling release means doing both of these, not just the first:
#   1. add required reviewers to the `release` environment, or move the
#      repository to a plan that supports them, and
#   2. restore the `workflow_run` trigger on completion of "Auto Tag", which is
#      how a tag becomes a release.
#
# Nothing is dispatched by accident in the meantime. `resolve-tag` fails fast
# if a run does start, rather than publishing from a half-resolved state.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tag is not available as an input on `workflow_run` — there is no
  # `github.ref` pointing at it. It is derived from the commit the triggering
  # run reported, which works regardless of what caused the run, rather than
  # assuming a push-to-tag event shape.
  resolve-tag:
    name: resolve tag
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # This workflow is disabled (see the top of the file). A manual dispatch
      # carries no `workflow_run` payload, so fail here with the reason rather
      # than letting a half-resolved run reach `publish`.
      - name: Refuse a manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::error::automatic release is disabled. Re-enable it per the comment at the top of this file before publishing."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Find tag
        id: resolve
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="$(git tag --points-at "${HEAD_SHA}" --sort=-creatordate | head -n 1)"
          if [ -z "${tag}" ]; then
            echo "::error::no tag points at ${HEAD_SHA}"
            exit 1
          fi
          echo "Resolved release tag: ${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  # Always runs, needs no secrets, and is the job that actually proves the
  # release is publishable: every crate is packaged and dry-run in dependency
  # order, so a broken manifest or a missing path dependency is caught before
  # anything is uploaded.
  verify:
    name: verify packaging
    needs: resolve-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Dry-run publish
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Dry-run publishing ${TAG}"
          # Dependency order: a crate cannot be published before the crate it
          # depends on exists on the registry. `protocol-droid-macros` is
          # independent of the schema, but `protocol-droid` depends on it, so
          # it goes second rather than last. Publishing it last makes
          # `cargo publish -p protocol-droid` fail with "no matching package
          # named `protocol-droid-macros` found".
          for crate in protocol-droid-schema protocol-droid-macros protocol-droid protocol-droid-cli; do
            echo "::group::${crate}"
            cargo publish --dry-run -p "${crate}"
            echo "::endgroup::"
          done

  publish:
    name: publish
    needs: [resolve-tag, verify]
    runs-on: ubuntu-latest
    # Gate the upload on a reviewable environment rather than letting a green
    # CI run push four crates to crates.io unattended.
    #
    # THIS IS A NO-OP UNLESS THE ENVIRONMENT IS CONFIGURED. Nothing in this
    # repository creates it, so until someone creates an environment named
    # `release` in the repository settings *with required reviewers enabled*,
    # the publish step runs unattended. The key is kept because it is the right
    # shape; the gate is manual setup, not code. See "Releasing" in README.md.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # A fork, or a repository where the token has not been configured, has
          # no secret. Skip with a warning rather than failing the chain, so
          # the `verify` result above is still reported.
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping publish of ${TAG}"
            exit 0
          fi
          # Same order as `verify` above: schema and macros first because they
          # are the two leaves, then the library, then the CLI that depends on
          # it. crates.io needs a moment to index a new crate, so each publish
          # is allowed to settle before the next one resolves it.
          for crate in protocol-droid-schema protocol-droid-macros protocol-droid protocol-droid-cli; do
            echo "::group::${crate}"
            cargo publish -p "${crate}"
            echo "::endgroup::"
          done

  # A release is a binary on a download page, not just a crates.io entry. The
  # matrix builds the CLI for the three OSes a consumer actually runs
  # (Linux, macOS, Windows), on the same three architectures the project's
  # CI matrix covers (x86_64, aarch64, plus x86_64-musl for static linux).
  #
  # The `targets` list mirrors the CI test matrix so a target that CI did
  # not run is not released; a build that CI did not exercise is a build
  # whose consumers are the canary.
  #
  # The artifacts are uploaded to a GitHub Release tagged `${tag}` (the
  # output of `resolve-tag`). A maintainer then edits the release notes
  # through the GitHub UI; this job does not write release notes
  # programmatically, because a hand-edited note is a reviewed note and a
  # template-derived note is a PR-description pasted into a release.
  binaries:
    name: binaries (${{ matrix.label }})
    needs: resolve-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            binary: protocol-droid
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            label: linux-x86_64-musl
            binary: protocol-droid
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            label: linux-aarch64-musl
            binary: protocol-droid
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            binary: protocol-droid
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            binary: protocol-droid
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            binary: protocol-droid.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build release binary
        # The CLI is a `[[bin]]` in the `protocol-droid-cli` crate. The build
        # is not `--workspace`; only the CLI ships, the library does not.
        # `--locked` is the gate against a Cargo.lock drift the verifier
        # never saw.
        run: |
          set -euo pipefail
          cargo build \
            --release \
            --locked \
            --target "${{ matrix.target }}" \
            --bin "${{ matrix.binary }}"
      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd "target/${{ matrix.target }}/release"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "../../../dist/${{ matrix.binary }}-${{ matrix.label }}.zip" "${{ matrix.binary }}"
          else
            tar -C "target/${{ matrix.target }}/release" \
              -czf "dist/${{ matrix.binary }}-${{ matrix.label }}.tar.gz" \
              "${{ matrix.binary }}"
          fi
      - name: Upload to release
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        # `softprops/action-gh-release` is the standard upload step; the
        # `files:` glob picks up whichever archive the packaging step
        # produced. The job does not *create* the release — `resolve-tag`
        # already pushed the tag, and the first upload auto-creates the
        # GitHub Release that goes with it. Subsequent uploads edit the
        # same release, so the per-OS jobs do not race on creation.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          # A maintainer-edited body is what the project rule is asking
          # for; the action's default body is fine when none is set.
          fail_on_unmatched_files: true
          # `draft: true` is the safer default: a maintainer reviews the
          # release notes and the asset list in the GitHub UI, then
          # publishes from there. The CI auto-creating a public release
          # is the failure mode this job is hedging against.
          draft: true
