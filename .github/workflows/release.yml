name: Release

# Publishing four crates to crates.io. The upload sits behind the `release`
# environment, which carries required reviewers so a green CI run cannot
# publish unattended.
#
# The review gate is load-bearing and was the reason this workflow sat
# disabled. Note that the earlier note here — "GitHub does not offer required
# reviewers for private repositories on the free plan" — described a private
# repository. This one is public, so required reviewers are available at no
# cost and the gate is real. `environment: release` with empty protection
# rules is NOT a gate: it is a label. If the rules are ever cleared, this
# workflow uploads to crates.io on a green run and a timer, which is the
# failure the original disablement was there to prevent. Re-check them before
# trusting a green run:
#
#   gh api repos/greysquirr3l/protocol-droid/environments/release \
#     --jq '.protection_rules'
#
# A tag becomes a release through the `workflow_run` trigger on "Auto Tag".
# A manual dispatch names its own tag; see the `on:` block.
on:
  # A tag becomes a release through "Auto Tag", not through a push to a tag
  # ref: auto-tag.yml is what decides that a commit has earned one, and this
  # consumes that decision rather than racing it.
  workflow_run:
    workflows: ['Auto Tag']
    types: [completed]
  # Manual re-run for a tag the trigger missed. `resolve-tag` resolves the tag
  # from the dispatch input instead of the `workflow_run` payload, so this path
  # is self-contained rather than depending on the event that triggered it.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.2.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The tag is not available as an input on `workflow_run` — there is no
  # `github.ref` pointing at it. It is derived from the commit the triggering
  # run reported, which works regardless of what caused the run, rather than
  # assuming a push-to-tag event shape.
  resolve-tag:
    name: resolve tag
    # Only a successful `workflow_run` may trigger this. A failed Auto Tag run
    # means no tag was created, and `publish` must not run on a tag that was
    # never minted. The dispatch path is gated separately, below.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # The tag is derived from the event rather than assumed from `github.ref`:
      # a `workflow_run` carries no ref pointing at the tag, so the commit it
      # reported is the only place the tag can be read from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha || '' }}
      - name: Find tag
        id: resolve
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_TAG}" ]; then
            # A dispatch names its tag, so trust the input but check it is a
            # real ref: a typo should fail here rather than publish `HEAD`.
            if ! git rev-parse --verify --quiet "refs/tags/${REQUESTED_TAG}" > /dev/null; then
              echo "::error::no such tag: ${REQUESTED_TAG}"
              exit 1
            fi
            tag="${REQUESTED_TAG}"
          else
            if [ -z "${HEAD_SHA}" ]; then
              echo "::error::no head sha and no requested tag; nothing to release"
              exit 1
            fi
            tag="$(git tag --points-at "${HEAD_SHA}" --sort=-creatordate | head -n 1)"
            if [ -z "${tag}" ]; then
              # Auto Tag succeeds without tagging when the workspace version
              # already has a tag on an earlier commit. That is the common
              # case, not a failure: most green pushes to main are not
              # releases. Report it and let every downstream job skip.
              echo "No tag points at ${HEAD_SHA}; nothing to release."
              echo "tag=" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          echo "Resolved release tag: ${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  # Always runs, needs no secrets, and is the job that actually proves the
  # release is publishable before anything is uploaded.
  #
  # It cannot verify all four crates, and the reason is structural rather than
  # something this job could be written around. `protocol-droid` declares its
  # siblings as `path` + `version`. Publishing strips the `path`, and both
  # `cargo package` and `cargo publish --dry-run` re-resolve the stripped
  # manifest against the registry *before* they can build or upload anything.
  # So on a crate's very first release — the one where its siblings do not
  # exist on crates.io yet — neither command can even package it:
  #
  #   error: failed to prepare local package for uploading
  #   Caused by: no matching package named `protocol-droid-macros` found
  #
  # `--no-verify` does not help: the resolution it skips is the build, not the
  # packaging. There is no flag that packages a crate whose declared dependency
  # is not on the registry, because that is the exact state the registry is
  # being asked to accept.
  #
  # So the leaves are verified here in full, and the two dependents are
  # verified by the upload itself, in dependency order, in the `publish` job.
  # Every *later* release verifies all four here, because by then 0.x.y exists
  # on the registry for the siblings this release bumps past. Which of the two
  # paths ran is reported explicitly rather than inferred from a green tick.
  verify:
    name: verify packaging
    needs: resolve-tag
    if: needs.resolve-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Verify packaging
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "Verifying ${TAG} (${version})"

          # The two leaves depend on nothing internal, so a full dry-run —
          # package, manifest lint, and a build of the packaged source against
          # registry-resolved third-party deps — is available for them on their
          # first release as well as every one after.
          for crate in protocol-droid-schema protocol-droid-macros; do
            echo "::group::dry-run ${crate} ${version}"
            cargo publish --dry-run -p "${crate}"
            echo "::endgroup::"
          done

          # `protocol-droid` and `protocol-droid-cli` are verified only once
          # their siblings are on the registry (see the job comment). That is
          # the upload, not this job. What *can* be checked here is everything
          # registry-independent: the manifest parses, the metadata is present
          # and within crates.io's limits, and the crate builds with its
          # siblings resolved from the workspace rather than from crates.io.
          for crate in protocol-droid protocol-droid-cli; do
            echo "::group::check ${crate} ${version}"
            cargo metadata --format-version 1 --no-deps > /dev/null
            cargo check -p "${crate}" --all-features
            echo "::endgroup::"
          done

          {
            echo "### Packaging verified for ${TAG}"
            echo
            echo "| Crate | Verified |"
            echo "| --- | --- |"
            echo "| \`protocol-droid-schema\` | full \`cargo publish --dry-run\` |"
            echo "| \`protocol-droid-macros\` | full \`cargo publish --dry-run\` |"
            echo "| \`protocol-droid\` | manifest + \`cargo check --all-features\`; packaging and upload verify it |"
            echo "| \`protocol-droid-cli\` | manifest + \`cargo check --all-features\`; packaging and upload verify it |"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: publish
    needs: [resolve-tag, verify]
    runs-on: ubuntu-latest
    # The upload waits for a human here. This is a real gate only while the
    # `release` environment carries required reviewers; see the note at the
    # top of this file. With the rules in place, a maintainer approves the
    # release before any crate is uploaded.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # A fork, or a repository where the token has not been configured, has
          # no secret. Skip with a warning rather than failing the chain, so
          # the `verify` result above is still reported.
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping publish of ${TAG}"
            exit 0
          fi
          # Same order as `verify` above: schema and macros first because they
          # are the two leaves, then the library, then the CLI that depends on
          # it. Ordering alone is not enough — the next crate resolves the
          # previous one from the registry index, and a crate that was uploaded
          # a second ago is not necessarily in that index yet. Publishing the
          # library immediately after the macros would fail with the same
          # "no matching package named ... found" that `verify` documents,
          # this time after a partial upload. So each upload waits for its
          # version to become resolvable before the next one starts.
          version="${TAG#v}"

          # Idempotent, for the same reason auto-tag is. Re-running this
          # workflow must not fail on work that is already done: a second
          # dispatch after a partial publish — or a re-run once a later fix
          # has repaired the binary archives — would otherwise stop at
          # "crate version already exists" and never reach the job that
          # actually still has work to do. crates.io versions are immutable,
          # so "already resolvable" is the strongest possible statement that
          # this crate needs no upload.
          for crate in protocol-droid-schema protocol-droid-macros protocol-droid protocol-droid-cli; do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: protocol-droid-release' \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            if [ "${code}" = "200" ]; then
              echo "::notice::${crate} ${version} is already on crates.io; skipping"
              continue
            fi
            echo "::group::publish ${crate} ${version}"
            cargo publish -p "${crate}"
            echo "::endgroup::"
          done

          # Post-upload proof, so the release is not reported green on the
          # strength of a command that exited 0 while crates.io was still
          # deciding what to do with it. `publish` returning means the tarball
          # was accepted, not that the version is resolvable, so each crate is
          # polled until the registry serves it. A crate skipped as already
          # published satisfies this immediately, which is the point.
          for crate in protocol-droid-schema protocol-droid-macros protocol-droid protocol-droid-cli; do
            echo -n "Waiting for ${crate} ${version} to appear on crates.io"
            for _ in $(seq 1 60); do
              code="$(curl -s -o /dev/null -w '%{http_code}' \
                -H 'User-Agent: protocol-droid-release-verify' \
                "https://crates.io/api/v1/crates/${crate}/${version}")"
              if [ "${code}" = "200" ]; then
                echo " ok"
                break
              fi
              echo -n "."
              sleep 10
            done
            if [ "${code:-000}" != "200" ]; then
              echo "::error::${crate} ${version} is not resolvable on crates.io"
              exit 1
            fi
          done

  # A release is a binary on a download page, not just a crates.io entry. The
  # matrix builds the CLI for the three OSes a consumer actually runs
  # (Linux, macOS, Windows), on the same three architectures the project's
  # CI matrix covers (x86_64, aarch64, plus x86_64-musl for static linux).
  #
  # The `targets` list mirrors the CI test matrix so a target that CI did
  # not run is not released; a build that CI did not exercise is a build
  # whose consumers are the canary.
  #
  # The artifacts are uploaded to a GitHub Release tagged `${tag}` (the
  # output of `resolve-tag`). A maintainer then edits the release notes
  # through the GitHub UI; this job does not write release notes
  # programmatically, because a hand-edited note is a reviewed note and a
  # template-derived note is a PR-description pasted into a release.
  binaries:
    name: binaries (${{ matrix.label }})
    needs: resolve-tag
    if: needs.resolve-tag.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    # Creating the draft GitHub Release and attaching assets is a write to
    # `contents`; the workflow-wide default is read-only.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            binary: protocol-droid
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            label: linux-x86_64-musl
            binary: protocol-droid
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            label: linux-aarch64-musl
            binary: protocol-droid
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            binary: protocol-droid
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            binary: protocol-droid
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            binary: protocol-droid.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # `ring` compiles C and assembly, and the musl targets have no compiler
      # on the runner. The x86_64 one is `musl-gcc` from `musl-tools`; the
      # aarch64 one is the GNU cross compiler, which is enough for `ring`
      # because Rust links musl's libc itself.
      - name: Install a C compiler for the musl target
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y musl-tools
            echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          fi
      - name: Build release binary
        # Bash on every OS: the default shell on Windows is PowerShell, which
        # cannot parse `set -euo pipefail`.
        shell: bash
        # The CLI is a `[[bin]]` in the `protocol-droid-cli` crate. The build
        # is not `--workspace`; only the CLI ships, the library does not.
        # `--locked` is the gate against a Cargo.lock drift the verifier
        # never saw.
        run: |
          set -euo pipefail
          binary="${{ matrix.binary }}"
          cargo build \
            --release \
            --locked \
            --target "${{ matrix.target }}" \
            --bin "${binary%.exe}"
      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Package from inside the release directory, so both branches write
          # the archive to the same place: `target/<triple>/release` is three
          # levels down, which makes `../../../dist` the workspace `dist` the
          # mkdir above just made.
          #
          # `tar -C target/<triple>/release` here would be wrong twice over —
          # the path is relative to the directory this block just cd'd into, so
          # it names `target/<triple>/release/target/<triple>/release`, and it
          # would be redundant even if it resolved.
          cd "target/${{ matrix.target }}/release"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "../../../dist/${{ matrix.binary }}-${{ matrix.label }}.zip" "${{ matrix.binary }}"
          else
            tar -czf "../../../dist/${{ matrix.binary }}-${{ matrix.label }}.tar.gz" \
              "${{ matrix.binary }}"
          fi
      - name: Upload to release
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        # `softprops/action-gh-release` is the standard upload step; the
        # `files:` glob picks up whichever archive the packaging step
        # produced. The job does not *create* the release — `resolve-tag`
        # already pushed the tag, and the first upload auto-creates the
        # GitHub Release that goes with it. Subsequent uploads edit the
        # same release, so the per-OS jobs do not race on creation.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          # A maintainer-edited body is what the project rule is asking
          # for; the action's default body is fine when none is set.
          fail_on_unmatched_files: true
          # `draft: true` is the safer default: a maintainer reviews the
          # release notes and the asset list in the GitHub UI, then
          # publishes from there. The CI auto-creating a public release
          # is the failure mode this job is hedging against.
          draft: true
