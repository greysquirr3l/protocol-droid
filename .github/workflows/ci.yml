name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. Every job inherits this, and narrows it again where it needs
# more than read access. Nothing here needs write access to the repository.
permissions:
  contents: read

# A new push to a branch supersedes the run already in flight for that branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must match `channel` in rust-toolchain.toml. Stated explicitly rather than
  # left implicit so the workflow cannot silently follow a different toolchain
  # than the file pins.
  RUST_TOOLCHAIN: "1.98.1"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # `cargo l` is the alias in .cargo/config.toml and carries the whole
      # profile on its own. This fails if Cargo.lock is stale or absent, so the
      # committed lockfile is actually pinned rather than merely present.
      - name: Verify lockfile is current
        run: cargo fetch --locked
      - name: Lint
        run: cargo l

  docs:
    # Rustdoc's intra-doc link checker runs only under `cargo doc`, so neither
    # `cargo l` nor `cargo test` sees it. Without this job a link to a renamed
    # or deleted item survives to publish, and docs.rs — which builds with
    # `-D warnings` — fails the whole crate's documentation on it.
    #
    # `--all-features` because that is what docs.rs is configured to build: a
    # doc that silently omits the `http`, `oauth` and `a2a` surfaces is worse
    # than one that is broken loudly.
    name: rustdoc
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Verify lockfile is current
        run: cargo fetch --locked
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps

  test:
    # The matrix key is `features`, not `feature-set`: a hyphen in a property
    # name is parsed by the expression language as a subtraction.
    name: test (${{ matrix.os }}, ${{ matrix.features.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failure, not just the first. A Windows-only failure should
      # not be masked by an unrelated Linux one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features:
          - name: all-features
            args: --all-features
          - name: no-default-features
            args: --no-default-features
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.features.name }}
      # `cargo test` does not build benches, and it does not build examples
      # unless one is a test target. A bench or example that imports a
      # feature-gated module without declaring `required-features` therefore
      # fails only for a consumer who opts into that feature — or for
      # `cargo check --all-targets`, which nobody ran. `a2a_serving` shipped
      # exactly this way and broke the plain default build.
      - name: Check every target builds
        run: cargo check --workspace --all-targets ${{ matrix.features.args }}
      - name: Test
        # 30 min is generous — the slowest cell (Linux all-features)
        # finishes in ~12 min locally. The ceiling exists because a
        # hung test in a previous run held a Windows cell for over
        # five hours and blocked every merge to main. A self-fail at
        # 30 min surfaces a hang immediately, the next run picks up
        # the fix once the offending test is identified.
        #
        # `tests/a2a_client_wire.rs` previously hung Windows
        # all-features because its 14 tests each `tokio::spawn`ed
        # an `axum::serve` against a `TcpListener::bind("127.0.0.1:0")`
        # and discarded the `JoinHandle` — `axum::serve` did not
        # unwind its `hyper` driver cleanly on cancellation, so the
        # test binary held every socket open. The fix is a
        # `TestPeerGuard` that owns the `JoinHandle` plus a
        # `oneshot::Sender` the server's `with_graceful_shutdown`
        # is awaiting, and drains the server on drop. Same pattern
        # (`axum::serve` + discarded `JoinHandle`) remains in
        # `tests/http_bridge_*.rs` and `tests/http_transport_wire.rs`
        # and is a follow-up if Windows all-features hangs again.
        timeout-minutes: 30
        run: cargo test --workspace ${{ matrix.features.args }}

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # This action fetches a fresh advisory database, which is the whole point
      # of running it in CI: a local `cargo deny` may answer from a stale cache
      # and pass on an advisory that has since been published.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      # The three lockfiles outside the workspace get the same scan.
      #
      # `fuzz`, `interop_rmcp` and `interop_ts_sdk` are each their own
      # workspace, so the step above — which scans the root graph — never sees
      # their dependency graphs. A committed `Cargo.lock` is a dependency graph
      # someone will build, so it gets the same scrutiny. This is not
      # hypothetical: when `ctutils` was bumped for RUSTSEC-2026-0385, the root
      # lockfile was updated and the interop fixture's was not, so the fixture
      # kept the vulnerable version until a human ran the pre-push hook.
      #
      # `--locked` is the point of these steps. Without it, `cargo metadata`
      # re-resolves and *rewrites* the committed lockfile, so the scan would
      # report on a graph nobody committed. With it, the scan reports on the
      # lockfile as committed — and fails loudly when that lockfile is stale,
      # which is the failure mode worth catching.
      #
      # The cost is that a workspace version bump invalidates these
      # lockfiles, because each one pins `protocol-droid` by version. The
      # release checklist refreshes them; see docs/dev/repo-operations.md.
      #
      # `advisories sources` rather than a full `check`: the full check also
      # runs `bans` and `licenses`, and these three crates fail both for
      # reasons that have nothing to do with supply chain — they carry no
      # `license` field, and their path dependency on `protocol-droid` has no
      # version, which `bans` reads as a wildcard. Advisories and sources are
      # what this job is for.
      - name: cargo-deny (fuzz)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/protocol-droid/fuzz/Cargo.toml
          arguments: --all-features --locked
          command-arguments: advisories sources
      - name: cargo-deny (interop_rmcp)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/protocol-droid/tests/interop_rmcp/Cargo.toml
          arguments: --all-features --locked
          command-arguments: advisories sources
      - name: cargo-deny (interop_ts_sdk)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/protocol-droid/tests/interop_ts_sdk/Cargo.toml
          arguments: --all-features --locked
          command-arguments: advisories sources

  fuzz:
    # The fuzz job runs nightly, not on every push. libFuzzer
    # needs minutes, not seconds, to find anything; a
    # push-triggered run would either flake (too short) or
    # burn the CI budget (too long). A `schedule` trigger
    # fires once a day at the same UTC hour, with
    # `concurrency.cancel-in-progress: true` so a long
    # Saturday run does not stack up against a Sunday one.
    name: fuzz
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    concurrency:
      group: fuzz-${{ github.workflow }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Install stable + nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      # The fuzz crate is `cargo-fuzz` driven; the
      # `libfuzzer-sys` shim it pulls in is a C/C++ build
      # that wants clang. The Ubuntu image ships with it
      # pre-installed; an Alpine-flavoured runner would
      # need an explicit `apt install` step here.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Fuzz envelope_round_trip
        run: |
          cargo +nightly fuzz run envelope-round-trip \
            --manifest-path crates/protocol-droid/fuzz/Cargo.toml \
            -- -max_total_time=1800
      - name: Fuzz transport_spec_parse
        run: |
          cargo +nightly fuzz run transport-spec-parse \
            --manifest-path crates/protocol-droid/fuzz/Cargo.toml \
            -- -max_total_time=1800
      # A crash becomes a `crash-<sha256>.bin` file in the
      # fuzz crate's `artifacts/`. The runner uploads
      # everything it finds so a maintainer can re-run
      # the regression locally with `cargo fuzz run <target>
      # artifacts/crash-<hash>.bin`.
      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: |
            crates/protocol-droid/fuzz/artifacts/
          if-no-files-found: ignore
