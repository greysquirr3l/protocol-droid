name: Auto Tag

# Triggered by CI completing, not by a push. This is deliberate: the tag is
# created with GITHUB_TOKEN, and a push made with GITHUB_TOKEN deliberately
# does NOT trigger other workflows' `on: push` filters. Wiring the release
# chain to `push: tags` would therefore never fire.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    name: tag
    # Only a green run on main earns a tag. The pull_requests guard matters:
    # `workflow_run` also fires for the CI runs GitHub performs on pull
    # requests, and those must never produce a tag.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.pull_requests[0] == null
    runs-on: ubuntu-latest
    permissions:
      # The one job in this repository that needs write access.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve workspace version
        id: version
        # Every member inherits `version` from [workspace.package], so the first
        # package cargo reports carries the version for the whole workspace.
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Idempotent. Re-running this workflow must not move or overwrite an
          # existing tag, so a released version is a hard stop rather than
          # something to force.
          if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            echo "tag ${tag} already exists; nothing to do"
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "created=true" >> "${GITHUB_OUTPUT}"
