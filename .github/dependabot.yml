# Dependency updates. Cargo covers the whole workspace from the root manifest;
# the individual crate manifests inherit their versions from
# [workspace.dependencies], so there is nothing to configure per crate.
version: 2

updates:
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Etc/UTC
  open-pull-requests-limit: 10
  commit-message:
    prefix: "chore(deps)"

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Etc/UTC
  # One PR for all action bumps. They are only useful together: a runner
  # upgrade and an action upgrade have to land at the same time to be tested
  # against each other.
  groups:
    github-actions:
      patterns: [ "*" ]
  commit-message:
    prefix: "chore(ci)"

# The documentation site is a separate project under site/, with its own
# pnpm lockfile. It needs an entry of its own: Dependabot reads one manifest
# per update, so the cargo entry above cannot see it.
#
# The ecosystem is `npm_and_yarn` despite there being no npm or Yarn in the
# project — that is the name GitHub gives the Node ecosystem generally, and
# it is the one that reads pnpm-lock.yaml.
#
# Grouped for the same reason the action bumps are: @astrojs/starlight is
# tightly coupled to astro's major version, so bumping one without the other
# produces a site that does not build. One PR, tested together.
- package-ecosystem: npm_and_yarn
  directory: "/site"
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Etc/UTC
  open-pull-requests-limit: 10
  groups:
    site:
      patterns: [ "*" ]
  commit-message:
    prefix: "chore(site)"

# The interop fixture is a checked-in `package.json` that `cargo test` spawns
# with `npm install`. Dependabot's security updates reach it without this
# entry existing, which is how GHSA-rxp7-6hxx-x8q5 (ip-address, medium)
# arrived as PR #55.
#
# `ip-address` is ignored rather than bumped. It is a transitive dependency of
# the pinned SDK, not something this repository chose, and the advisory is
# quadratic matching on an IPv6 zone identifier — a field no MCP peer sends.
# Bumping it would churn a lockfile that exists to pin `@modelcontextprotocol/sdk`
# at one known version so the interop test tests that version.
#
# The SDK itself is an exact pin with no range, so the default versioning
# strategy leaves it alone. Declaring the directory is what lets the ignore
# apply; it does not opt the fixture into update churn.
- package-ecosystem: npm_and_yarn
  directory: "/crates/protocol-droid/tests/interop_ts_sdk/fixtures"
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Etc/UTC
  open-pull-requests-limit: 5
  ignore:
    # GHSA-rxp7-6hxx-x8q5 affects <= 10.7.3; the range covers exactly the
    # vulnerable versions and no others, so a future advisory that 10.7.4 is
    # also subject to would still be reported.
    - dependency-name: "ip-address"
      versions: ["<= 10.7.3"]
  commit-message:
    prefix: "chore(interop-fixture)"
