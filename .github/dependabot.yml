# Dependency updates. Cargo covers the whole workspace from the root manifest;
# the individual crate manifests inherit their versions from
# [workspace.dependencies], so there is nothing to configure per crate.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    # One PR for all action bumps. They are only useful together: a runner
    # upgrade and an action upgrade have to land at the same time to be tested
    # against each other.
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
