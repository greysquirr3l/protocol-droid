# Dependency updates. Cargo covers the whole workspace from the root manifest;
# the individual crate manifests inherit their versions from
# [workspace.dependencies], so there is nothing to configure per crate.
version: 2

updates:
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Etc/UTC
  open-pull-requests-limit: 10
  commit-message:
    prefix: "chore(deps)"

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Etc/UTC
  # One PR for all action bumps. They are only useful together: a runner
  # upgrade and an action upgrade have to land at the same time to be tested
  # against each other.
  groups:
    github-actions:
      patterns: [ "*" ]
  commit-message:
    prefix: "chore(ci)"

# The documentation site is a separate project under site/, with its own
# pnpm lockfile. It needs an entry of its own: Dependabot reads one manifest
# per update, so the cargo entry above cannot see it.
#
# The ecosystem is `npm_and_yarn` despite there being no npm or Yarn in the
# project — that is the name GitHub gives the Node ecosystem generally, and
# it is the one that reads pnpm-lock.yaml.
#
# Grouped for the same reason the action bumps are: @astrojs/starlight is
# tightly coupled to astro's major version, so bumping one without the other
# produces a site that does not build. One PR, tested together.
- package-ecosystem: npm_and_yarn
  directory: "/site"
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Etc/UTC
  open-pull-requests-limit: 10
  groups:
    site:
      patterns: [ "*" ]
  commit-message:
    prefix: "chore(site)"

# The interop fixture is a checked-in `package.json` that `cargo test` spawns
# with `npm install`. It was never declared here, but Dependabot's security
# updates reach it anyway, which is how GHSA-rxp7-6hxx-x8q5 (ip-address,
# medium) arrived as PR #55.
#
# The entry exists so that the fixture's transitive dependencies get the same
# attention as the workspace's, not to suppress them. `ip-address` was ignored
# here first, on the reasoning that a transitive bump churns a lockfile whose
# job is to hold the SDK at one version. That was wrong: the SDK's own
# declared range for ip-address is `^10.2.0`, so 10.7.4 was always
# permitted, and the bump moved three lines and left the SDK at 1.32.1.
#
# `npm install` does not do this on its own -- it honours the lockfile, so
# 10.7.3 stayed installed until the lockfile was updated deliberately. That
# is the whole argument for keeping the entry: a lockfile that is never
# updated by hand is a lockfile that silently keeps a known-vulnerable
# transitive version.
- package-ecosystem: npm_and_yarn
  directory: "/crates/protocol-droid/tests/interop_ts_sdk/fixtures"
  schedule:
    interval: weekly
    day: monday
    time: "05:00"
    timezone: Etc/UTC
  open-pull-requests-limit: 5
  commit-message:
    prefix: "chore(interop-fixture)"
