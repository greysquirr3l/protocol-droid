[package]
name = "protocol-droid-macros"
description = "Procedural macros for the protocol-droid Model Context Protocol toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# A proc-macro crate is built for the host and cannot be used by the crates that
# would consume it, which is why this is a separate crate rather than a module.
proc-macro = true

# The generated code names `protocol_droid` through `::`, so the macro crate
# itself needs nothing from it — only `syn`, to read the signatures.

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full", "extra-traits"] }

[dev-dependencies]
# A dev-dependency cycle, so this crate's doctests can use the macros
# on a type that actually compiles. `version` is required alongside
# `path` and not optional: cargo-deny bans bare path dependencies, and
# rightly — a published crate cannot name a path.
protocol-droid = { path = "../protocol-droid", version = "0.1.0" }
schemars = "1.2.2"
serde = { workspace = true, features = ["derive"] }
