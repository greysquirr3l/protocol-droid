[package]
name = "protocol-droid-macros"
description = "Procedural macros for the protocol-droid Model Context Protocol toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/protocol-droid-macros"
readme.workspace = true
keywords.workspace = true
# The slugs `syn` and the other derive crates carry. A proc-macro crate has no
# network or parser surface of its own, so claiming either would be a lie.
categories = ["development-tools::procedural-macro-helpers", "parser-implementations"]

[lib]
# A proc-macro crate is built for the host and cannot be used by the crates that
# would consume it, which is why this is a separate crate rather than a module.
proc-macro = true

# The generated code names `protocol_droid` through `::`, so the macro crate
# itself needs nothing from it — only `syn`, to read the signatures.

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full", "extra-traits"] }
