[package]
# Interop test crate for the official TypeScript MCP SDK
# (`@modelcontextprotocol/sdk`). NOT a workspace member — the workspace's
# `members = [...]` in the root `Cargo.toml` `exclude`s this directory
# on purpose: a transient dev-only crate pulling `tokio` and `serde`
# should not widen the resolver's dependency closure every workspace
# member has to be built against. The TS SDK itself lives in
# `fixtures/node_modules/` and is fetched with `npm install`; the
# Cargo side of this crate only knows about the wire shape and the
# process boundary.
#
# The crate is invoked by hand (`cargo test -p interop-ts-sdk` from
# inside this directory) and by the CI matrix in
# `.github/workflows/conformance.yml`'s `interop` job. It is not part
# of `cargo test --workspace`; a publisher never sees it; a consumer
# never has to think about it.
#
# `name` is unique on crates.io because the crate never publishes;
# the surface stays local.
name = "interop-ts-sdk"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

# The empty `[workspace]` table opts this manifest out of the parent
# workspace's resolver and members list. `package.workspace = ".."`
# alone is not enough — cargo's package-belongs-to-workspace test is
# the *presence* of a parent workspace, not the parent's membership
# decision, and the only signal cargo accepts from the package is a
# `[workspace]` table of its own.
[workspace]


[lib]
name = "interop_ts_sdk"
path = "src/lib.rs"

[dependencies]
# The same `protocol-droid` the rmcp interop crate drives, with the
# same shape — `StdioClient` is the public surface both cross-tests
# share, and a divergence between the two interop crates would be
# the wire-shape itself diverging, not a per-crate convenience.
protocol-droid = { path = "../.." }

# The protocol-droid test surface uses the same runtime the library
# uses, so the matrix test does not introduce a new tokio feature
# surface for the resolver to argue about.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time"] }

# `serde` and `serde_json` are already in the workspace's transitive
# closure through `protocol-droid`, so pinning them here is just a
# local readability choice — a reader can see the wire types the test
# round-trips without having to look them up.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `anyhow` is the binary crate's error type, and the `Failure`
# `From<anyhow::Error>` impl in the test crate is the bridge
# between the two error vocabularies. Putting it in `[dependencies]`
# rather than `[dev-dependencies]` is what makes the `impl` visible
# to the lib's callers.
anyhow = "1"

[lints.rust]
warnings = "deny"
missing_docs = "deny"
uninhabited_static = "deny"
ambiguous_glob_imported_traits = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# Same hard denies as the workspace: a non-workspace crate cannot
# inherit the lints section, so they are repeated here. A drift
# between the two is a `cargo l` failure on the workspace, which is
# exactly the safety net the rule is for.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
suspicious = { level = "deny", priority = -1 }

# The same tolerances the workspace allows; keeping the list identical
# is what makes a `deny` on the workspace mean the same thing as
# `deny` here.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
