[package]
name = "protocol-droid"
description = "A Model Context Protocol toolkit that speaks every published spec revision, with one canonical IR behind many per-revision codecs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# No `[features]` table yet. The feature gates for each transport, the legacy
# SSE path, and OAuth are introduced by the tasks that implement them (T13-T16),
# not declared empty in advance.

[features]
# The envelope decoder defaults to `serde_json`, which is portable and has no
# target-specific code. `simd` swaps in a vectorised parser behind a flag so the
# two can be benchmarked against each other rather than argued about; it is off
# by default because a `default-features = false` build has to stay lean and
# because a decoder that is only fast on some targets is a portability trap.
default = ["serde", "stdio"]
# serde_json is the portable default and is always compiled — the generated
# wire types depend on it, so it is data rather than an optional integration.
serde = []
# T13. The stdio transport is the only adapter in the crate that names a
# runtime, so it is the one adapter that is gated. `default-features = false`
# drops the executor, the `AsyncRead`/`AsyncWrite` plumbing and the diagnostic
# channel with it, leaving the domain, the IR and every codec — which is the
# shape a server that speaks only HTTP, or a tool that only speaks the IR, wants.
stdio = ["dep:tokio"]
# T14. The Streamable HTTP server adapter, which is the other half of the same
# story: `stdio` covers the process-spawning client and this covers the
# network server, and the two disagree about nearly everything. `http` is
# **not** a default because the two transports are alternatives, not a set —
# a `stdio` server has no use for a `Router`, and a `default-features = false`
# build is how a consumer says "I am linking this as a library, not running a
# server". Turning it on adds axum, the `net` half of tokio, and the SSE
# responder; everything protocol-shaped — the session store, the event ring,
# the idempotency port, the routing headers, negotiation — is already compiled
# without it, so a consumer that only wants the IR and the codecs pays for none
# of this.
http = ["dep:axum", "dep:futures-core", "dep:reqwest", "dep:tower", "dep:tokio", "tokio/net", "tokio/rt", "tokio/sync", "tokio/macros"]
# T15. The deprecated 2024-11-05 HTTP+SSE transport, which `2025-03-26`
# replaced and which is the only transport that revision speaks. It needs the
# HTTP stack, so it implies it rather than listing it again — and it is a
# separate gate from `http` because the two are alternatives, not a set: a
# server that speaks Streamable HTTP has no use for a second endpoint and an
# `endpoint` event. `TransportKind::LegacySse` stays ungated in the domain,
# because describing a transport costs nothing and only speaking it does.
legacy-sse = ["http"]
# T16. OAuth 2.1 authorization. It implies `http` because both token sources
# reach an authorization server that is somewhere else, and it adds the one
# dependency the rest of the crate has no use for: a JWS signature check.
#
# Only the *adapters* are gated. `domain/mcp/authorization` and
# `application/oauth/token` stay compiled in a lean build for the same reason
# the session store and the routing headers do — they are protocol-shaped and
# pure, and gating them would cost a consumer the authorization model to save
# nothing.
oauth = ["http", "dep:jsonwebtoken", "dep:sha2", "dep:base64", "dep:url"]
# Session ids that do not enumerate. `IdSource` is a port every server must
# satisfy and this crate shipped no implementation of it, so the only code a
# consumer could copy was a `fetch_add` counter.
random-ids = ["dep:getrandom"]
# T27. The A2A (Agent2Agent) protocol module — per-revision method table,
# per-revision wire codec, and the application handlers behind them. Gated
# on its own feature because (a) the dependency footprint is independent of
# MCP and a consumer that never speaks A2A should not pay it, and (b) the
# feature gate is the seam that lets a future `a2a-grpc` / `a2a-rest` build
# on top of this without re-touching MCP. `domain/a2a` and `application/a2a`
# stay compiled in a lean build for the same reason the MCP domain does —
# they are pure value objects, so gating them would cost the version model to
# save nothing.
a2a = []

[dependencies]
# The registry publishes a new immutable snapshot by swapping the `Arc`. Not
# optional: the capability's requirement is that reads are lock-free, and an
# `RwLock` would make `tools/list` contend with a publish.
arc-swap = { workspace = true }
protocol-droid-macros = { version = "0.1.0", path = "../protocol-droid-macros" }
protocol-droid-schema = { workspace = true }
schemars = "1.2.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Only the `stdio` adapter needs an executor. `io-std` for the `AsyncRead`/
# `AsyncWrite` helpers and `tokio::io::Stderr`, `io-util` for the `AsyncReadExt`
# and `AsyncWriteExt` traits, and `process` for the child a client spawns.
#
# `process` does NOT need the public `signal` feature. On a Unix target tokio
# compiles its `SIGCHLD` reaper for `process` regardless, because
# `cfg_signal_internal!` in tokio's `macros/cfg.rs` is
# `any(feature = "signal", all(unix, feature = "process"))` — so enabling
# `signal` would add the public signal *API* and buy nothing, and a client that
# never registers a signal handler has no use for it. `rt` and `sync` come from
# the workspace declaration above and are not repeated.
tokio = { workspace = true, optional = true, features = [
    "io-std",
    "io-util",
    "process",
] }
# T14. The Streamable HTTP server. `http` turns these on; nothing else does,
# and a `--no-default-features` build resolves without them at all.
axum = { workspace = true, optional = true }
# T17. `limit` for the concurrency ceiling and `timeout` for the request
# deadline. Both are service wrappers rather than logic — re-implementing a
# semaphore-guarded service or a `tokio::time::timeout` wrapper by hand is the
# kind of "obviously simple" that is subtly wrong about cancellation, and
# `tower` is already in the workspace so this adds no new resolution.
tower = { workspace = true, optional = true, features = ["limit", "timeout", "util"] }
futures-core = { workspace = true, optional = true }
# T14. The Streamable HTTP client, gated by the same `http` feature as the
# server above: a consumer that does not run an HTTP server has no use for an
# HTTP client, and the two are alternatives rather than a set.
reqwest = { workspace = true, optional = true }
# T16. JWS signature verification for the JWKS token source. See the workspace
# declaration for why `use_pem` and `aws_lc_rs` are both off.
jsonwebtoken = { workspace = true, optional = true }
# T16. The OS CSPRNG behind `RandomIds`, so a server can mint session ids that
# do not enumerate. `getrandom` rather than `rand`: this is one `u64` per
# session opened, not a stream of draws, and it wants no seeding, no thread-local
# state and no `Default`.
getrandom = { workspace = true, optional = true }
# T16 stage 7. PKCE. `sha2` for the S256 derivation and `base64` for its
# base64url encoding — both are pulled by `jsonwebtoken` already, and both are
# declared here because the client half needs them directly rather than through
# somebody else's re-export. The `base64` line repeats the dev-dependency below
# rather than hoisting it to `[workspace.dependencies]`: one crate uses it, and
# a workspace table entry would invite a second one.
sha2 = { workspace = true, optional = true }
base64 = { version = "0.22.1", default-features = false, features = [
    "alloc",
], optional = true }
# T16 stage 7. Building the authorization redirect. `url` is already in the
# graph through `reqwest`, and appending query parameters to an endpoint that
# may already carry some is the case hand-rolled percent-encoding gets wrong:
# the endpoint comes from a discovery document this crate does not control.
url = { version = "2.5.8", optional = true }

[dev-dependencies]
# The envelope path is the project's one perf-critical path, so its decode,
# route, and params-decode costs are measured rather than estimated. CI gates a
# >10% regression against the committed baseline.
divan = { workspace = true }
assert_matches = { workspace = true }
# The golden feature profiles are snapshots a human reviews, so a matrix change
# shows up as a diff to read rather than as a failure to debug.
insta = { workspace = true }
# The lowering properties are the crate's central claim — that a value which
# fits survives a round trip, and that the gate is exact — so they are generated
# rather than hand-picked. A hand-picked value proves one case was thought of.
proptest = { workspace = true }
# `StreamExt::next` over a response body. Dev-only: nothing in the adapter
# consumes a `Stream` through these helpers, but a test reading the replayed
# frames out of an open SSE response has no other way to stop before the
# stream parks forever waiting for a push that is not coming.
futures-util = { version = "0.3.31", default-features = false, features = [
    "std",
] }
# The capability table is checked against the vendored `schema.json` files, so
# the domain's model is verified against the bytes it describes rather than
# against a second copy of the same assumptions.
serde_json = { workspace = true }
# The cancellation race test needs a real scheduler: a single-poll harness can
# prove the waker fires, but not that a handler awaiting the signal is resumed
# and then suppressed from answering. `time::pause` makes the deadline part of
# that test instantaneous and deterministic.
tokio = { workspace = true, features = ["rt", "time"] }
trybuild = "1.0.121"
# RFC 7515 base64url, for the one JWT no encoder will produce: an unsecured
# `alg: none` token. `jsonwebtoken` depends on it too, so this is a dev-only
# path to a crate already in the graph rather than a new one.
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
# Drives a `Router` to a response without binding a socket, which is what lets
# the security-header test read headers off a real response rather than
# asserting that a middleware value is `Some`.
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

# divan is its own harness; libtest would only add a wrapper around a binary
# that is meant to be run directly.
[[bench]]
name = "jsonrpc_hot_path"
harness = false

[[bench]]
name = "registry"
harness = false

# Cargo builds every file in `examples/` for every feature configuration, so an
# example that speaks a gated transport must declare what it needs or
# `cargo test --workspace --no-default-features` — a CI matrix entry, not a
# hypothetical — fails to compile it. The example is skipped rather than built
# lean; a stripped-down stdio server would demonstrate nothing.
[[example]]
name = "stdio_server"
required-features = ["stdio"]

[[example]]
name = "server"
required-features = ["http"]

[[example]]
name = "conformance_reference_server"
required-features = ["http", "random-ids"]
