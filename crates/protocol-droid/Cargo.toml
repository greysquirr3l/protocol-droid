[package]
name = "protocol-droid"
description = "A Model Context Protocol toolkit that speaks every published spec revision, with one canonical IR behind many per-revision codecs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# No `[features]` table yet. The feature gates for each transport, the legacy
# SSE path, and OAuth are introduced by the tasks that implement them (T13-T16),
# not declared empty in advance.

[dependencies]
protocol-droid-schema = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The golden feature profiles are snapshots a human reviews, so a matrix change
# shows up as a diff to read rather than as a failure to debug.
insta = { workspace = true }
# The lowering properties are the crate's central claim — that a value which
# fits survives a round trip, and that the gate is exact — so they are generated
# rather than hand-picked. A hand-picked value proves one case was thought of.
proptest = { workspace = true }
# The capability table is checked against the vendored `schema.json` files, so
# the domain's model is verified against the bytes it describes rather than
# against a second copy of the same assumptions.
serde_json = { workspace = true }

[lints]
workspace = true
