[package]
name = "protocol-droid"
description = "A Model Context Protocol toolkit that speaks every published spec revision, with one canonical IR behind many per-revision codecs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# No `[features]` table yet. The feature gates for each transport, the legacy
# SSE path, and OAuth are introduced by the tasks that implement them (T13-T16),
# not declared empty in advance.

[features]
# The envelope decoder defaults to `serde_json`, which is portable and has no
# target-specific code. `simd` swaps in a vectorised parser behind a flag so the
# two can be benchmarked against each other rather than argued about; it is off
# by default because a `default-features = false` build has to stay lean and
# because a decoder that is only fast on some targets is a portability trap.
default = ["serde"]
# serde_json is the portable default and is always compiled — the generated
# wire types depend on it, so it is data rather than an optional integration.
serde = []

[dependencies]
# The registry publishes a new immutable snapshot by swapping the `Arc`. Not
# optional: the capability's requirement is that reads are lock-free, and an
# `RwLock` would make `tools/list` contend with a publish.
arc-swap = { workspace = true }
protocol-droid-macros = { version = "0.1.0", path = "../protocol-droid-macros" }
protocol-droid-schema = { workspace = true }
schemars = "1.2.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The envelope path is the project's one perf-critical path, so its decode,
# route, and params-decode costs are measured rather than estimated. CI gates a
# >10% regression against the committed baseline.
divan = { workspace = true }
assert_matches = { workspace = true }
# The golden feature profiles are snapshots a human reviews, so a matrix change
# shows up as a diff to read rather than as a failure to debug.
insta = { workspace = true }
# The lowering properties are the crate's central claim — that a value which
# fits survives a round trip, and that the gate is exact — so they are generated
# rather than hand-picked. A hand-picked value proves one case was thought of.
proptest = { workspace = true }
# The capability table is checked against the vendored `schema.json` files, so
# the domain's model is verified against the bytes it describes rather than
# against a second copy of the same assumptions.
serde_json = { workspace = true }
# The cancellation race test needs a real scheduler: a single-poll harness can
# prove the waker fires, but not that a handler awaiting the signal is resumed
# and then suppressed from answering. `time::pause` makes the deadline part of
# that test instantaneous and deterministic.
tokio = { workspace = true }
trybuild = "1.0.121"

[lints]
workspace = true

# divan is its own harness; libtest would only add a wrapper around a binary
# that is meant to be run directly.
[[bench]]
name = "jsonrpc_hot_path"
harness = false

[[bench]]
name = "registry"
harness = false
