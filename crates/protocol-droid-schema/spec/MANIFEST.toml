# ─── A2A revisions ────────────────────────────────────────────────────────────
# Each A2A revision is keyed by its tag. The `package` key mirrors the proto
# file's `package` declaration (`lf.a2a.v1`, etc.), so the codegen can route
# the per-version types to the right Rust module. A future revision with a
# different `package` line will need its own entry; the [meta.a2a] section
# above is the version-independent part.
#
# `files` is the same shape as `revisions.<mcp>.files`: a flat
# `name -> sha256` map. The MCP entries are a flat map, and keeping the
# A2A entries the same shape means one map type can serve both — a
# future codegen that takes a `BTreeMap<String, String>` and locks
# each entry against the disk digest needs no A2A-vs-MCP branch.

[a2a_revisions."v1.0"]
tag = "v1.0.0"
commit = "173695755607e884aa9acf8ce4feed90e32727a1"
package = "lf.a2a.v1"
spec_prefix = "specification"

[a2a_revisions."v1.0".files]
"a2a.proto" = "4b74c0baa923ae0acb55474e548f1d6e5d3f83b80d757b65f8bf3e99a3c2257f"
# Versions older than v1.0 (0.1.0 through 0.3.0) used a JSON-RPC binding
# without a version header; the negotiation model in domain/a2a
# does not cover them. They are deliberately not vendored; a consumer
# who needs them implements the v1 wire format and translates.

# ─── ACP protocol ─────────────────────────────────────────────────────────────
# Phase 9 added ACP. The agent-client-protocol project's canonical wire
# definition is the JSON Schema at
# `agentclientprotocol/agent-client-protocol/schema/v1/schema.json`,
# pinned by release tag (the release tag is `schema-v<version>` to
# disambiguate from the JSON-RPC namespace). The schema is published
# alongside a hand-written `meta.json` that names every method
# (the schema is method-agnostic; methods are layered on top by the
# `meta.json`).
#
# ACP is pre-1.0 (the first release was `schema-v0.0.1` in late 2024; the
# current pin is `schema-v1.25.0`). Per the task's experimental carve-out,
# the version stays pinned to a single release; future bumps are
# separate tasks that re-verify the wire contract.
#
# `repo` mirrors the A2A entry: `agentclientprotocol/agent-client-protocol`.

[acp_revisions."v1.25.0"]
