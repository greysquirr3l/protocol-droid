# ─── draft ────────────────────────────────────────────────────────────────────
# `draft` is a floating revision with no tag. It is pinned to an explicit commit
# so builds stay reproducible, and is refreshed only by an explicit
# `cargo xtask refresh-spec draft` — never during a build.

[revisions.draft]
tag = ""
commit = "db788e34ffc0c7253f099f647a5e25e0396fadfe"
schema_prefix = "schema/draft"
# A floating revision has no tag, so a refresh resolves this branch to a commit
# and pins the result. "Whatever main pointed at when we last looked" is not a
# reproducible pin; a commit is.
branch = "main"
changelog = "docs/specification/draft/changelog.mdx"
floating = true
# Upstream's draft changelog is a placeholder ("Changes since the most recent
# release will accumulate here."). Vendored verbatim; not a defect in this repo.
changelog_is_placeholder = true

