# MANIFEST.toml — provenance for every vendored MCP spec revision.
#
# This file is the single source of truth for what is vendored and where it came
# from. `cargo xtask refresh-spec <version>` rewrites it; a test and build.rs
# both verify the files on disk against the digests recorded here.
#
# NEVER hand-edit a digest. Re-run the xtask.
#
# The revision keys are quoted: `[revisions."2024-11-05"]`, not
# `[revisions.2024-11-05]`. Both are legal TOML 1.0, but taplo's parser reads a
# bare key beginning with a digit as a number and reports "expected identifier",
# so the unquoted form lights up the editor with parse errors. Do not
# "normalise" these back to bare keys.

[meta]
schema_version = 1
# Upstream repository, in the form `owner/name`.
repository = "modelcontextprotocol/specification"
# Base for raw file downloads, pinned by tag or by full commit SHA.
raw_base = "https://raw.githubusercontent.com/modelcontextprotocol/specification"

# ─── A2A protocol ─────────────────────────────────────────────────────────────
# Phase 9 added A2A. The A2A project's canonical wire definition is the proto
# at `a2aproject/A2A/specification/a2a.proto`; the JSON Schema is a non-normative
# build artifact derived from it (see the README at
# `specification/json/README.md`). We vendor the proto for now and the JSON
# artifact will be generated by `cargo xtask refresh-spec-a2a` once the
# codegen pipeline lands. The repository URL is `a2aproject/A2A`.
# Verdicts on the tags this project deliberately does not vendor, so the
# exclusion is a recorded decision rather than an oversight. Re-verify with
# `curl https://api.github.com/repositories/862570523/tags`.
[meta.excluded_tags]
"2024-10-07" = "Superseded by 2024-11-05; predates the first published revision."
"2024-11-05-final" = "Same revision as 2024-11-05. Differs only in repository layout (adds the per-version schema/ directory)."
"2025-11-25-RC" = "Release candidate, superseded by the 2025-11-25 final."
"2026-07-28-RC" = "Release candidate, superseded by the 2026-07-28 final."

# ─── 2024-11-05 ───────────────────────────────────────────────────────────────
# The first published revision. Its schema lives at the repository root's
# `schema/` directory rather than `schema/<version>/` — the per-version layout
# was introduced later. Do not "fix" this path; it 404s at the newer layout.

[revisions."2024-11-05"]
tag = "2024-11-05"
commit = "0d63bea927001bedf3be3e59be735c979ba0aacb"
schema_prefix = "schema"
# No `changelog` key. Upstream ships no changelog for this revision, so the
# vendored CHANGELOG.md is hand-written. An absent key is what marks a changelog
# as authored: the verifier then expects the file on disk but holds no digest
# for it, so it can be edited without breaking the build.

[revisions."2024-11-05".files]
"schema.json" = "56d9e706cc8b0daf690a483960aa4ba62217c863d36ff1d7f8bbb83ab049903d"
"schema.ts"   = "3cc60f4f2ab5d6129d2bab47954d534546be6f3f1920ffb9ff9a60cb04339586"
# CHANGELOG.md is deliberately absent: it is authored, not vendored (see
# `changelog = "authored"` above), so it carries no digest. Digest-locking a
# hand-written file would break the build on every edit to it. The verifier
# reconciles this in both directions and will fail if an unlisted, undeclared
# file ever appears in this directory.

