[package]
name = "protocol-droid-cli"
description = "Command-line Swiss-army knife for the protocol-droid Model Context Protocol toolkit: bridge, probe, inspect, record and replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/protocol-droid-cli"
readme.workspace = true
keywords.workspace = true
# `command-line-interface` is what `clap` and the rest of the CLI ecosystem
# carry; `command-line-utilities` does not exist as a slug.
categories = ["command-line-interface", "network-programming"]

[features]
# T18. `bridge` is the subcommand that *serves*, so it needs both transports the
# library can speak as a client: `stdio` for this process's own channel and `http`
# for the upstream it forwards to. The `--check-result` probe deliberately stays
# outside it — that path opens no socket, and a build that cannot open one should
# still be able to answer "what would this bridge do with this reply".
default = ["bridge"]
# `random-ids` is not optional here: an `http` listen hands out a session id
# on every `initialize`, and the peer presents it on every request after
# that. A counter would be a guessable session.
bridge = [
  "protocol-droid/http",
  "protocol-droid/stdio",
  "protocol-droid/legacy-sse",
  "protocol-droid/random-ids",
  "protocol-droid/oauth",
]
# `a2a` is the A2A side of the probe. It is gated to match the
# library's A2A module: the A2A `AgentCard` type and the
# `A2aJsonRpcPeer` are both behind `protocol-droid/a2a`, and a
# build that has no A2A surface also has no A2A probe.
a2a = [
  "protocol-droid/a2a",
  "protocol-droid/http",
  "bridge",
]

[[bin]]
name = "protocol-droid"
path = "src/main.rs"

[lib]
name = "protocol_droid_cli"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
# Not optional: `main` builds a runtime so the serving path can be `.await`ed
# from a plain `fn main`. The lean-core property belongs to the *library*; a
# binary that cannot drive its own subcommands is not a smaller binary, it is a
# broken one.
tokio = { workspace = true, features = ["io-std", "rt", "macros", "process"] }
# `conformance self` probes the fixture server's port over loopback HTTP, so a
# `reqwest::Client` is the only thing that needs to be added. A leaner approach
# would be `tokio::net::TcpStream` + a hand-written JSON-RPC POST, but the
# probe is a single well-formed request — a one-off `reqwest` is the cheaper
# answer to write, and `reqwest` is already in the workspace's transitive
# closure through the `protocol-droid` library.
reqwest = { workspace = true, features = ["json"], default-features = false }
protocol-droid = { workspace = true }

[lints]
workspace = true
